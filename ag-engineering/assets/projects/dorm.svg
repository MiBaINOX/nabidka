<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0e2444"/>
      <stop offset="100%" stop-color="#173459"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#255182" stroke-width="0.75" stroke-opacity="0.45"/>
      <circle cx="30" cy="0" r="1.5" fill="#3f92d2" fill-opacity="0.6"/>
    </pattern>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f92d2" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3f92d2" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#bgGrad)"/>
  <rect width="600" height="380" fill="url(#grid)"/>

  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="520" height="230" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4" stroke-opacity="0.4" rx="6"/>
    
    <!-- Technical Axis & Crosshairs -->
    <line x1="20" y1="20" x2="500" y2="20" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.3"/>
    <line x1="20" y1="210" x2="500" y2="210" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.3"/>
    <line x1="20" y1="20" x2="20" y2="210" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.3"/>
    <line x1="500" y1="20" x2="500" y2="210" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.3"/>

    <!-- Axis labels -->
    <text x="25" y="15" fill="#38bdf8" font-family="monospace" font-size="9" opacity="0.8">AXIS X-01 // AG-ENG</text>
    <text x="430" y="15" fill="#38bdf8" font-family="monospace" font-size="9" opacity="0.8">SPEC: ČSN EN</text>
    <text x="25" y="222" fill="#38bdf8" font-family="monospace" font-size="9" opacity="0.8">TOL: ±0.5mm</text>
    <text x="430" y="222" fill="#38bdf8" font-family="monospace" font-size="9" opacity="0.8">REV: FINAL</text>

    <!-- Specific Graphic Shape by Type -->
    
        <!-- Architectural Isometric Building -->
        <g stroke="#38bdf8" stroke-width="1.5" fill="none">
          <!-- Main volume -->
          <polygon points="120,180 260,180 260,60 120,60" fill="#075985" fill-opacity="0.3"/>
          <polygon points="260,180 380,130 380,30 260,60" fill="#0369a1" fill-opacity="0.4"/>
          <polygon points="120,60 260,60 380,30 240,30" fill="#38bdf8" fill-opacity="0.2"/>

          <!-- Structural Grid Windows -->
          <line x1="155" y1="60" x2="155" y2="180" stroke="#bae6fd" stroke-width="0.75" stroke-opacity="0.6"/>
          <line x1="190" y1="60" x2="190" y2="180" stroke="#bae6fd" stroke-width="0.75" stroke-opacity="0.6"/>
          <line x1="225" y1="60" x2="225" y2="180" stroke="#bae6fd" stroke-width="0.75" stroke-opacity="0.6"/>

          <line x1="120" y1="90" x2="260" y2="90" stroke="#bae6fd" stroke-width="0.75" stroke-opacity="0.6"/>
          <line x1="120" y1="120" x2="260" y2="120" stroke="#bae6fd" stroke-width="0.75" stroke-opacity="0.6"/>
          <line x1="120" y1="150" x2="260" y2="150" stroke="#bae6fd" stroke-width="0.75" stroke-opacity="0.6"/>

          <!-- Side windows in perspective -->
          <line x1="260" y1="90" x2="380" y2="55" stroke="#bae6fd" stroke-width="0.75" stroke-opacity="0.6"/>
          <line x1="260" y1="120" x2="380" y2="80" stroke="#bae6fd" stroke-width="0.75" stroke-opacity="0.6"/>
          <line x1="260" y1="150" x2="380" y2="105" stroke="#bae6fd" stroke-width="0.75" stroke-opacity="0.6"/>

          <!-- Level marker -->
          <circle cx="95" cy="60" r="12" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
          <text x="95" y="64" fill="#ffffff" font-family="monospace" font-size="9" text-anchor="middle">+14.50</text>
        </g>
        
  </g>

  <!-- Title Plate -->
  <rect x="40" y="275" width="520" height="75" fill="#071322" fill-opacity="0.9" stroke="#1e4976" stroke-width="1" rx="4"/>
  <line x1="40" y1="275" x2="560" y2="275" stroke="url(#cyanLine)" stroke-width="2"/>
  
  <text x="60" y="304" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" letter-spacing="0.5">Polyfunkční objekt DORM Brno</text>
  <text x="60" y="332" fill="#93c5fd" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="0.3">PSJ a.s. // Statické zajištění a demolice</text>

  <!-- Badge / Stamp -->
  <g transform="translate(460, 290)">
    <rect x="0" y="0" width="80" height="24" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" rx="3"/>
    <text x="40" y="16" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">VERIFIED</text>
  </g>
</svg>